name: Platform Supabase Migrations

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - "platform/supabase/migrations/**"
      - ".github/workflows/platform-supabase-migrations.yml"
  workflow_dispatch: {}

jobs:
  apply-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: platform/package-lock.json
      - name: Install platform dependencies
        working-directory: platform
        run: npm ci
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      # Supabase's direct database host (db.<ref>.supabase.co) resolves to an
      # IPv6 address unless the paid IPv4 add-on is enabled, and GitHub-hosted
      # runners have no IPv6 egress -- Supabase's own docs list GitHub Actions
      # as IPv4-only. So `--db-url` against the direct host fails here every
      # time with "dial error (connect ECONNREFUSED <v6 addr>:5432)", which is
      # what every run of this workflow did from 6 Sep 2026 onwards.
      #
      # Supavisor, the pooler, always has an IPv4 address. Session mode (port
      # 5432) is the one to use: transaction mode (6543) does not speak enough
      # of the protocol for migrations. See
      # https://supabase.com/docs/guides/platform/ipv4-address
      #
      # The secret still holds the direct URL, so the password is lifted out of
      # it and recombined against the pooler. A secret that already points at
      # the pooler is passed through untouched, so switching it over later
      # needs no change here.
      #
      # working-directory matters as much as the connection does. The CLI reads
      # `supabase/migrations` relative to where it runs, and this repo has TWO
      # such directories: `platform/supabase/migrations` (the real one, 1:1 with
      # the live ledger) and a root `supabase/` kept for the edge function that
      # deploy-edge-functions.yml ships -- which still carries three 2024/2025
      # migration files that predate the reconciliation and are in no ledger.
      # Run from the root, the CLI read those three, saw none of the ledger's
      # versions locally, and bailed with "Remote migration versions not found
      # in local migrations directory" listing all 116. It has never once
      # applied a migration from CI.
      - name: Apply production migrations
        working-directory: platform
        env:
          SUPABASE_DB_URL: ${{ secrets.CLEVERPLATFORM_SUPABASE_DB_URL }}
          PROJECT_REF: qnawglgnoojrlaivylou
          PROJECT_REGION: sa-east-1
        run: |
          set -euo pipefail

          if [[ -z "$SUPABASE_DB_URL" ]]; then
            echo "::warning::CLEVERPLATFORM_SUPABASE_DB_URL is not configured -- no migrations were applied. This job is green but did nothing."
            exit 0
          fi

          if [[ "$SUPABASE_DB_URL" == *pooler.supabase.com* ]]; then
            echo "Secret already points at Supavisor; using it as-is."
            supabase db push --db-url "$SUPABASE_DB_URL"
            exit 0
          fi

          # Split on the LAST '@': everything before it is scheme://user:password,
          # so a percent-encoded password containing '@' or ':' survives intact.
          userinfo="${SUPABASE_DB_URL%@*}"
          password="${userinfo#*://}"
          password="${password#*:}"
          if [[ -z "$password" || "$password" == "$userinfo" ]]; then
            echo "::error::Could not read a password out of CLEVERPLATFORM_SUPABASE_DB_URL. Expected postgresql://user:password@host:5432/postgres."
            exit 1
          fi
          # The derived URLs are not the secret GitHub knows to redact, so mask
          # the password before it can reach a log line.
          echo "::add-mask::$password"

          # Supabase runs more than one Supavisor cluster per region and a
          # project's pooler host is not derivable from its ref, so try each in
          # turn. A failed connection applies nothing, which makes this safe to
          # retry. Only the hostname is ever echoed.
          db_url=""
          for cluster in "aws-1-${PROJECT_REGION}" "aws-0-${PROJECT_REGION}"; do
            host="${cluster}.pooler.supabase.com"
            candidate="postgresql://postgres.${PROJECT_REF}:${password}@${host}:5432/postgres"
            echo "::add-mask::$candidate"
            if psql "$candidate" -Atqc 'select 1' >/dev/null 2>&1; then
              echo "Reached the database through ${host} (session mode)."
              db_url="$candidate"
              break
            fi
            echo "No route through ${host}; trying the next cluster."
          done

          if [[ -z "$db_url" ]]; then
            echo "::error::Could not reach the production database over IPv4 through any Supavisor cluster in ${PROJECT_REGION}. Check the password in CLEVERPLATFORM_SUPABASE_DB_URL, and confirm the project's pooler host on the Supabase dashboard connect page."
            exit 1
          fi

          supabase db push --db-url "$db_url"
      - name: Verify production schema after migrations
        working-directory: platform
        env:
          SUPABASE_URL: ${{ secrets.CLEVERPLATFORM_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CLEVERPLATFORM_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "Skipping schema probe because CLEVERPLATFORM_SUPABASE_URL or CLEVERPLATFORM_SUPABASE_SERVICE_ROLE_KEY is not configured."
            exit 0
          fi
          npm run deploy:check-schema
